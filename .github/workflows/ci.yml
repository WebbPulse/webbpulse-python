name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and test the shared package
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    permissions:
      contents: read
      id-token: write
    with:
      python-version: "3.13"
      working-directory: "."
      ruff-target: "src tests"
      coverage-source: "webbpulse"
      typecheck-command: mypy

  sso-changes:
    name: Detect SSO changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sso: ${{ steps.filter.outputs.sso }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            sso:
              - "src/webbpulse/identity/**"
              - "tests/test_identity_sso*"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"

  sso-keycloak:
    name: SSO against Keycloak
    runs-on: ubuntu-latest
    needs: [sso-changes]
    if: needs.sso-changes.outputs.sso == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    env:
      KEYCLOAK_URL: http://localhost:8080
      UV_PYTHON: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Keycloak in dev mode
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0.7 start-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install the package with every extra
        run: uv sync --locked

      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS "$KEYCLOAK_URL/realms/master" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1

      - name: Run the Keycloak OIDC and SAML sign-in tests
        run: |
          set -o pipefail
          uv run pytest tests/test_identity_sso_keycloak.py -rs | tee pytest.log
          grep -Eq "\b2 passed\b" pytest.log

      - name: Show Keycloak logs on failure
        if: failure()
        run: docker logs keycloak | tail -200

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [ci, sso-changes, sso-keycloak]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
