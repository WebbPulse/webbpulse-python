name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and test the shared package
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      python-version: "3.13"
      working-directory: "."
      install-command: >-
        python -m pip install --upgrade pip &&
        pip install -e ".[aws-otel,dynamodb,fastapi,identity,oauth,otel,passkeys,security,testing]" mypy ruff pytest-cov
        "boto3-stubs[dynamodb,kms,secretsmanager]" botocore-stubs
      ruff-target: "src tests"
      coverage-source: "webbpulse"

  types:
    name: Type check the shared package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package and the type checking tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[aws-otel,dynamodb,fastapi,identity,oauth,otel,passkeys,security,testing]" mypy \
            "boto3-stubs[dynamodb,kms,secretsmanager]" botocore-stubs

      - name: Mypy
        run: mypy

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [ci, types]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
