[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webbpulse"
description = "Shared infrastructure code for WebbPulse FastAPI services on AWS Lambda."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Tyler Webb", email = "tylert2610@gmail.com" }]
keywords = ["fastapi", "aws", "lambda", "dynamodb", "opentelemetry"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dynamodb = ["boto3>=1.35", "botocore>=1.35"]
fastapi = ["fastapi>=0.115", "starlette>=0.40", "uvicorn>=0.32"]
otel = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-botocore>=0.51b0",
]
aws-otel = ["aws-opentelemetry-distro>=0.10", "botocore>=1.35"]
security = ["PyJWT>=2.10,<3", "bcrypt>=4.1"]
testing = ["moto[dynamodb,secretsmanager]>=5", "pytest>=8", "httpx2>=2"]
identity = ["PyJWT[crypto]>=2.9", "fastapi>=0.115"]
oauth = ["httpx>=0.27"]
passkeys = ["webauthn>=2.7,<3"]

[project.urls]
Homepage = "https://github.com/WebbPulse/webbpulse-python"
Source = "https://github.com/WebbPulse/webbpulse-python"

[dependency-groups]
dev = [
  "webbpulse[aws-otel,dynamodb,fastapi,identity,oauth,otel,passkeys,security,testing]",
  "boto3-stubs[dynamodb,kms,secretsmanager]",
  "botocore-stubs",
  "mypy>=1.13",
  "pytest-cov>=6",
  "pytest-xdist>=3",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/webbpulse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/webbpulse"]

[tool.hatch.build.targets.sdist]
include = ["src/webbpulse", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "TID",
  "RUF",
]
ignore = [
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/webbpulse/lambda_entry.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["webbpulse"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/webbpulse", "tests"]
ignore_missing_imports = false
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["amazon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
